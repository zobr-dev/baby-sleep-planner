services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sleepplanner
      POSTGRES_USER: sleep
      POSTGRES_PASSWORD: sleep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleep -d sleepplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/sleepplanner
      JDBC_DATABASE_USERNAME: sleep
      JDBC_DATABASE_PASSWORD: sleep
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata:
