# Продакшен-конфигурация для VPS.
# Отличия от dev (docker-compose.yml):
#   - пароль БД берётся из .env (не хранится в репозитории);
#   - порт PostgreSQL НЕ публикуется наружу — база доступна только приложению;
#   - приложение слушает только 127.0.0.1 — наружу его отдаёт nginx (HTTPS);
#   - SESSION_COOKIE_SECURE=true (за HTTPS);
#   - restart: unless-stopped — переживает перезагрузку сервера.
#
# Запуск:
#   cp .env.example .env   # и впишите свой DB_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sleepplanner
      POSTGRES_USER: sleep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleep -d sleepplanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/sleepplanner
      JDBC_DATABASE_USERNAME: sleep
      JDBC_DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      SESSION_COOKIE_SECURE: "true"
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Почта для кода сброса пароля. По умолчанию выключена (код пишется в лог).
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      # только localhost — публичный доступ идёт через nginx-реверс-прокси
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
