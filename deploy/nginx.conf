# Пример конфигурации nginx как реверс-прокси перед приложением.
#
# Установка на сервере (Ubuntu):
#   1. apt install -y nginx certbot python3-certbot-nginx
#   2. Скопируйте этот файл и замените baby-sleep-planner.ru на свой домен:
#        cp deploy/nginx.conf /etc/nginx/sites-available/sleep
#        sudo sed -i 's/baby-sleep-planner.ru/g' /etc/nginx/sites-available/sleep
#   3. ln -s /etc/nginx/sites-available/sleep /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d baby-sleep-planner.ru
#      (certbot сам добавит блок listen 443 ssl, сертификаты и редирект с http)

server {
    listen 80;
    server_name baby-sleep-planner.ru;

    # Размер тела запроса можно ограничить — API принимает маленький JSON
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Важно: сообщает Spring, что снаружи HTTPS — иначе secure-cookie сессии
        # не будет выставляться корректно.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
