server:
  port: ${PORT:8080}
  # учитывать X-Forwarded-* от реверс-прокси (nginx) — нужно за HTTPS-прокси
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # за HTTPS на проде выставьте SESSION_COOKIE_SECURE=true
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sleepplanner}
    username: ${JDBC_DATABASE_USERNAME:sleep}
    password: ${JDBC_DATABASE_PASSWORD:sleep}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # update — авто-создание/обновление схемы для удобства запуска.
      # На проде рекомендуется validate + миграции (Flyway/Liquibase).
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  # SMTP для писем со сбросом пароля. Если SMTP_HOST не задан и MAIL_ENABLED=false,
  # код сброса не отправляется, а пишется в лог (удобно для разработки).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: "true"
      mail.smtp.starttls.enable: "true"

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@baby-sleep-planner.ru}

logging:
  level:
    org.hibernate.SQL: warn
